spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}  # <- ejemplo: mongo sería el nombre del contenedor si usás Docker

  datasource:
    url: ${POSTGRES_DB_JDBC}  # <- ejemplo: postgres nombre del contenedor o IP
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # ✅ Nunca actualizar la DB automáticamente en prod
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database: postgresql

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
    refresh-expiration: 604800000

logging:
  level:
    org.springframework: INFO
    org.springdoc: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method