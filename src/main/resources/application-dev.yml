spring:
  application:
    name: JaityMangaReader

  data:
    mongodb:
      uri: mongodb://localhost:27017/jaity_db

  datasource:
    url: jdbc:postgresql://localhost:5432/manga_db
    username: jaity
    password: secret123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql

  security:
    user:
      name: admin
      password: admin

app:
  jwt:
    secret: 
    expiration: 3600000       # 1h access token (en ms)
    refresh-expiration: 604800000  # 7 días (en ms)


logging:
  level:
    org.springdoc: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method